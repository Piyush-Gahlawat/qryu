    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%234f46e5'/><text x='50' y='68' font-size='52' font-family='system-ui' font-weight='700' text-anchor='middle' fill='white'>S</text></svg>" />

</head>

<body>
    <main class="container">
        <nav class="nav"><a href="/">← Shiryu Kit home</a></nav>

        <h1>Password Generator</h1>
        <p class="subtitle">Strong random passwords — generated in your browser, never sent anywhere.</p>

        <div class="output-row">
            <input id="output" type="text" readonly aria-label="Generated password" />
            <button id="copy-btn" type="button">Copy</button>
        </div>

        <div class="field">
            <div class="field-head">
                <label for="length">Length</label>
                <span id="len-val">16</span>
            </div>
            <input id="length" type="range" min="8" max="64" value="16" />
        </div>

        <div class="checks">
            <label class="check"><input id="opt-upper" type="checkbox" checked /> Uppercase (A–Z)</label>
            <label class="check"><input id="opt-lower" type="checkbox" checked /> Lowercase (a–z)</label>
            <label class="check"><input id="opt-numbers" type="checkbox" checked /> Numbers (0–9)</label>
            <label class="check"><input id="opt-symbols" type="checkbox" checked /> Symbols (!@#…)</label>
            <label class="check"><input id="opt-ambiguous" type="checkbox" /> Exclude look-alikes</label>
        </div>

        <button id="generate-btn" class="btn btn-primary" type="button">Generate Password</button>

        <p id="strength" class="status" aria-live="polite"></p>

        <p class="footer-note" style="margin-bottom: 10px;">

        </p>

            Built by <strong>Shiryu</strong> · Free forever ·
            <a href="https://github.com/Piyush-Gahlawat/qr-generator" target="_blank" rel="noopener">Source on
                GitHub</a>
        </p>
    </main>

    <script type="module" src="/js/tools/password/controller.js"></script>
</body>

</html>
