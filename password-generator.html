    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1a1d29;
            --muted: #6b7280;
            --brand: #4f46e5;
            --brand-dark: #4338ca;
            --border: #e5e7eb;
            --error: #dc2626;
            --ok: #059669;
            --warn: #d97706;
            --radius: 14px;
            --shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 22px 26px;
        }

        .nav { margin-bottom: 18px; }
        .nav a {
            font-size: 0.85rem;
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }
        .nav a:hover { text-decoration: underline; }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 20px;
        }

        /* Output */
        .output-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        #output {
            flex: 1;
            min-width: 0;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 1rem;
            padding: 14px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: #fafbfc;
            color: var(--text);
            text-align: center;
            letter-spacing: 0.02em;
        }

        #copy-btn {
            flex: 0 0 auto;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            padding: 0 16px;
            border: none;
            border-radius: 10px;
            background: #eef2ff;
            color: var(--brand-dark);
            cursor: pointer;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        #copy-btn:hover { background: #e0e7ff; }
        #copy-btn.copied { background: #d1fae5; color: var(--ok); }

        /* Fields */
        .field { margin-bottom: 16px; }

        .field-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        #len-val {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--brand);
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--brand);
            height: 24px;
            cursor: pointer;
        }

        .checks {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 14px;
            margin-bottom: 20px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text);
            cursor: pointer;
            user-select: none;
        }

        .check input {
            width: 18px;
            height: 18px;
            accent-color: var(--brand);
            cursor: pointer;
            flex: 0 0 auto;
        }

        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.08s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.98); }
        .btn:focus-visible { outline: 3px solid rgba(79, 70, 229, 0.4); outline-offset: 2px; }

        .btn-primary {
            background: var(--brand);
            color: #fff;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.28);
        }
        .btn-primary:hover { background: var(--brand-dark); }

        /* Strength */
        .strength {
            margin-top: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            min-height: 1.4em;
        }
        .strength.weak { color: var(--error); }
        .strength.good { color: var(--warn); }
        .strength.strong { color: var(--ok); }

        /* Footer */
        .footer-note {
            margin-top: 22px;
            font-size: 0.78rem;
            color: var(--muted);
            text-align: center;
        }
        .footer-note a { color: var(--brand); text-decoration: none; }
        .footer-note a:hover { text-decoration: underline; }

        @media (max-width: 360px) {
            .checks { grid-template-columns: 1fr; }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1117;
                --card: #171a23;
                --text: #e8eaf0;
                --muted: #9096a3;
                --border: #2a2e3a;
                --shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
            }
            #output { background: #0f1117; color: var(--text); }
            #copy-btn { background: #1e2230; color: #c7cdff; }
            #copy-btn:hover { background: #262b3c; }
        }
    </style>
</head>

<body>

    <main class="container">
        <nav class="nav"><a href="/">← QRyu home</a></nav>

        <h1>Password Generator</h1>
        <p class="subtitle">Strong random passwords — generated in your browser, never sent anywhere.</p>

        <div class="output-row">
            <input id="output" type="text" readonly aria-label="Generated password" />
            <button id="copy-btn" type="button">Copy</button>
        </div>

        <div class="field">
            <div class="field-head">
                <label for="length">Length</label>
                <span id="len-val">16</span>
            </div>
            <input id="length" type="range" min="8" max="64" value="16" />
        </div>

        <div class="checks">
            <label class="check"><input id="opt-upper" type="checkbox" checked /> Uppercase (A–Z)</label>
            <label class="check"><input id="opt-lower" type="checkbox" checked /> Lowercase (a–z)</label>
            <label class="check"><input id="opt-numbers" type="checkbox" checked /> Numbers (0–9)</label>
            <label class="check"><input id="opt-symbols" type="checkbox" checked /> Symbols (!@#…)</label>
            <label class="check"><input id="opt-ambiguous" type="checkbox" /> Exclude look-alikes</label>
        </div>

        <button id="generate-btn" class="btn btn-primary" type="button">Generate Password</button>

        <p id="strength" class="strength" aria-live="polite"></p>

        <p class="footer-note">
            Built by <strong>Shiryu</strong> · Free forever ·
            <a href="https://github.com/Piyush-Gahlawat/qr-generator" target="_blank" rel="noopener">Source on GitHub</a>
        </p>
    </main>

    <script>
        (function () {
            'use strict';

            const output     = document.getElementById('output');
            const lengthEl   = document.getElementById('length');
            const lenVal     = document.getElementById('len-val');
            const upperEl    = document.getElementById('opt-upper');
            const lowerEl    = document.getElementById('opt-lower');
            const numEl      = document.getElementById('opt-numbers');
            const symEl      = document.getElementById('opt-symbols');
            const ambEl      = document.getElementById('opt-ambiguous');
            const genBtn     = document.getElementById('generate-btn');
            const copyBtn    = document.getElementById('copy-btn');
            const strengthEl = document.getElementById('strength');

            const SETS = {
                upper:   'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                lower:   'abcdefghijklmnopqrstuvwxyz',
                numbers: '0123456789',
                symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
            };
            const AMBIGUOUS = /[0O1lI|`'"]/g;

            /* Unbiased random int using crypto (NOT Math.random) */
            function randInt(max) {
                const limit = Math.floor(0xFFFFFFFF / max) * max;
                const arr = new Uint32Array(1);
                let x;
                do {
                    crypto.getRandomValues(arr);
                    x = arr[0];
                } while (x >= limit);
                return x % max;
            }

            function poolFor(set) {
                return ambEl.checked ? set.replace(AMBIGUOUS, '') : set;
            }

            function generate() {
                const length = parseInt(lengthEl.value, 10);

                const chosen = [];
                if (upperEl.checked) chosen.push(poolFor(SETS.upper));
                if (lowerEl.checked) chosen.push(poolFor(SETS.lower));
                if (numEl.checked)   chosen.push(poolFor(SETS.numbers));
                if (symEl.checked)   chosen.push(poolFor(SETS.symbols));

                if (chosen.length === 0) {
                    output.value = 'Select at least one type';
                    strengthEl.textContent = '';
                    strengthEl.className = 'strength';
                    return;
                }

                const pool = chosen.join('');
                const chars = [];

                // guarantee one char from each selected set
                for (const set of chosen) {
                    chars.push(set[randInt(set.length)]);
                }
                // fill the rest
                while (chars.length < length) {
                    chars.push(pool[randInt(pool.length)]);
                }
                // shuffle (Fisher–Yates)
                for (let i = chars.length - 1; i > 0; i--) {
                    const j = randInt(i + 1);
                    const tmp = chars[i];
                    chars[i] = chars[j];
                    chars[j] = tmp;
                }

                output.value = chars.slice(0, length).join('');
                updateStrength();
            }

            function updateStrength() {
                const pwd = output.value;
                if (!pwd) { strengthEl.textContent = ''; strengthEl.className = 'strength'; return; }

                let poolSize = 0;
                if (/[a-z]/.test(pwd)) poolSize += 26;
                if (/[A-Z]/.test(pwd)) poolSize += 26;
                if (/[0-9]/.test(pwd)) poolSize += 10;
                if (/[^a-zA-Z0-9]/.test(pwd)) poolSize += 30;

                const bits = Math.round(pwd.length * Math.log2(poolSize || 1));

                let label, cls;
                if (bits < 50)      { label = 'Weak';   cls = 'weak'; }
                else if (bits < 80) { label = 'Good';   cls = 'good'; }
                else                { label = 'Strong'; cls = 'strong'; }

                strengthEl.textContent = 'Strength: ' + label + ' (~' + bits + ' bits)';
                strengthEl.className = 'strength ' + cls;
            }

            function copyPassword() {
                const pwd = output.value;
                if (!pwd) return;

                const done = () => {
                    copyBtn.textContent = 'Copied';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = 'Copy';
                        copyBtn.classList.remove('copied');
                    }, 1500);
                };

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(pwd).then(done).catch(fallback);
                } else {
                    fallback();
                }

                function fallback() {
                    output.select();
                    output.setSelectionRange(0, 99999);
                    try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
                }
            }

            /* Wire up */
            lengthEl.addEventListener('input', () => {
                lenVal.textContent = lengthEl.value;
                generate();
            });
            [upperEl, lowerEl, numEl, symEl, ambEl].forEach(el =>
                el.addEventListener('change', generate)
            );
            genBtn.addEventListener('click', generate);
            copyBtn.addEventListener('click', copyPassword);

            /* First password on load */
            generate();
        })();
    </script>
</body>

</html>
