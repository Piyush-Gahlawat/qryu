    <meta name="twitter:title" content="Free QR Code Generator — No Signup" />
    <meta name="twitter:description" content="Turn any text or URL into a scannable QR code. Free, no signup." />

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%234f46e5'/><text x='50' y='68' font-size='52' font-family='system-ui' font-weight='700' text-anchor='middle' fill='white'>Q</text></svg>" />

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1a1d29;
            --muted: #6b7280;
            --brand: #4f46e5;
            --brand-dark: #4338ca;
            --border: #e5e7eb;
            --error: #dc2626;
            --radius: 14px;
            --shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 22px 26px;
        }

        .nav { margin-bottom: 18px; }
        .nav a {
            font-size: 0.85rem;
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }
        .nav a:hover { text-decoration: underline; }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 20px;
        }

        /* Form */
        .field {
            text-align: left;
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="text"] {
            width: 100%;
            font-size: 1rem;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: #fafbfc;
            color: var(--text);
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
            -webkit-appearance: none;
        }

        input[type="text"]::placeholder { color: #9ca3af; }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--brand);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.08s, background 0.15s, box-shadow 0.15s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn:active { transform: scale(0.98); }

        .btn:focus-visible {
            outline: 3px solid rgba(79, 70, 229, 0.4);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--brand);
            color: #fff;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.28);
        }
        .btn-primary:hover { background: var(--brand-dark); }

        .btn-secondary {
            background: #eef2ff;
            color: var(--brand-dark);
            margin-top: 10px;
        }
        .btn-secondary:hover { background: #e0e7ff; }

        /* Error */
        #error-msg {
            display: none;
            font-size: 0.88rem;
            color: var(--error);
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 12px;
            text-align: left;
        }

        /* QR output */
        #qr-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #qr-container img,
        #qr-container canvas {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 20px;
            padding: 10px;
            background: #fff;
            border: 1px solid var(--border);
        }

        /* Footer */
        .footer-note {
            margin-top: 22px;
            font-size: 0.78rem;
            color: var(--muted);
            text-align: center;
        }
        .footer-note a { color: var(--brand); text-decoration: none; }
        .footer-note a:hover { text-decoration: underline; }

        /* Mobile */
        @media (max-width: 360px) {
            .container { padding: 22px 16px 20px; }
            h1 { font-size: 1.2rem; }
            .btn, input[type="text"] { font-size: 0.95rem; }
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1117;
                --card: #171a23;
                --text: #e8eaf0;
                --muted: #9096a3;
                --border: #2a2e3a;
                --shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
            }
            input[type="text"] { background: #0f1117; color: var(--text); }
            input[type="text"]:focus { background: #0f1117; }
            .btn-secondary { background: #1e2230; color: #c7cdff; }
            .btn-secondary:hover { background: #262b3c; }
            #qr-container img,
            #qr-container canvas { background: #fff; }
            #error-msg { background: #2a1416; border-color: #4a1f24; }
        }
    </style>
</head>

<body>

    <main class="container">
        <nav class="nav"><a href="/">← QRyu home</a></nav>

        <h1>QR Code Generator</h1>
        <p class="subtitle">Turn any text or link into a scannable QR code. Free, no signup.</p>

        <div class="field">
            <label for="qr-input">Text or URL</label>
            <input
                id="qr-input"
                type="text"
                inputmode="url"
                placeholder="https://example.com"
                autocomplete="off"
            />
        </div>

        <button id="generate-btn" class="btn btn-primary" type="button">Generate QR</button>
        <button id="download-btn" class="btn btn-secondary" type="button" style="display:none;">
            Download PNG
        </button>

        <p id="error-msg"></p>

        <div id="qr-container"></div>

        <p class="footer-note" style="margin-bottom: 10px;">
            Also try: <a href="/password-generator.html">Password Generator</a> · <a href="/word-counter.html">Word Counter</a> ·
            <a href="/json-formatter.html">JSON Formatter</a> · <a href="/resume-cleaner.html">ATS Resume Cleaner</a>
        </p>
        <p class="footer-note">
            Built by <strong>Shiryu</strong> · Free forever ·
            <a href="https://github.com/Piyush-Gahlawat/qr-generator" target="_blank" rel="noopener">Source on GitHub</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        (function () {
            'use strict';

            const input       = document.getElementById('qr-input');
            const generateBtn = document.getElementById('generate-btn');
            const downloadBtn = document.getElementById('download-btn');
            const qrContainer = document.getElementById('qr-container');
            const errorMsg    = document.getElementById('error-msg');

            /* ---------- Helpers ---------- */

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
            }

            function clearError() {
                errorMsg.textContent = '';
                errorMsg.style.display = 'none';
            }

            function buildFilename(value) {
                const safe = value
                    .replace(/^https?:\/\//i, '')
                    .replace(/[^a-z0-9]/gi, '-')
                    .replace(/-+/g, '-')
                    .slice(0, 30)
                    .replace(/^-+|-+$/g, '');
                return (safe || 'qr-code') + '.png';
            }

            /* ---------- Generate ---------- */

            function generateQR() {
                clearError();

                if (typeof QRCode === 'undefined') {
                    showError('QR library failed to load. Check your connection and refresh.');
                    return;
                }

                const value = input.value.trim();

                if (!value) {
                    showError('Please enter some text or a URL.');
                    input.focus();
                    return;
                }

                if (value.length > 2000) {
                    showError('Text is too long — keep it under 2000 characters.');
                    return;
                }

                qrContainer.innerHTML = '';
                downloadBtn.style.display = 'none';

                try {
                    new QRCode(qrContainer, {
                        text: value,
                        width: 320,
                        height: 320,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    setTimeout(() => {
                        const img = qrContainer.querySelector('img');
                        if (img && img.src) {
                            downloadBtn.style.display = 'block';
                            downloadBtn.dataset.filename = buildFilename(value);
                        }
                    }, 50);
                } catch (err) {
                    console.error(err);
                    showError('Could not generate QR code. Please try again.');
                }
            }

            /* ---------- Download ---------- */

            function downloadQR() {
                const canvas = qrContainer.querySelector('canvas');
                const img    = qrContainer.querySelector('img');
                const name   = downloadBtn.dataset.filename || 'qr-code.png';

                let dataUrl = null;

                if (canvas) {
                    dataUrl = canvas.toDataURL('image/png');
                } else if (img && img.src) {
                    dataUrl = img.src;
                }

                if (!dataUrl) {
                    showError('Nothing to download yet — generate a QR code first.');
                    return;
                }

                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            /* ---------- Wire up ---------- */

            generateBtn.addEventListener('click', generateQR);

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') generateQR();
            });

            downloadBtn.addEventListener('click', downloadQR);
        })();
    </script>
</body>

</html>
