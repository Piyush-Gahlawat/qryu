<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>QRyu — Free QR Code Generator | Built by Shiryu</title>
    <meta name="google-site-verification" content="YOUR_UNIQUE_CODE_FROM_GOOGLE" />
    <meta name="description"
        content="Generate QR codes from any text or URL instantly. Download as PNG. Free, no signup, works on mobile and desktop. Built by Shiryu." />
    <meta name="keywords" content="qr code generator, free qr code, qr code maker, online qr generator india" />
    <link rel="canonical" href="https://qryu.pages.dev/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QRyu — Free QR Code Generator" />
    <meta property="og:description"
        content="Turn any text or URL into a scannable QR code. Free, no signup. Built by Shiryu." />
    <meta property="og:url" content="https://qryu.pages.dev/" />
    <meta property="og:site_name" content="QRyu" />

    <!-- Twitter preview -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="QRyu — Free QR Code Generator" />
    <meta name="twitter:description"
        content="Turn any text or URL into a scannable QR code. Free, no signup. Built by Shiryu." />

    <!-- Favicon (inline SVG, no file needed) -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%234f46e5'/><text x='50' y='68' font-size='52' font-family='system-ui' font-weight='700' text-anchor='middle' fill='white'>Q</text></svg>" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <main class="container">
        <h1>QRyu</h1>
        <p class="subtitle">Free QR code generator — built by Shiryu.</p>

        <div class="field">
            <label for="qr-input">Text or URL</label>
            <input id="qr-input" type="text" inputmode="url" placeholder="https://example.com" autocomplete="off" />
        </div>

        <button id="generate-btn" class="btn btn-primary">Generate QR</button>
        <button id="download-btn" class="btn btn-secondary" style="display:none;">
            Download PNG
        </button>

        <p id="error-msg"></p>

        <div id="qr-container"></div>

        <!-- single footer, INSIDE the card -->
        <p class="footer-note">
            Built by <strong>Shiryu</strong> · Free forever ·
            <a href="https://github.com/Piyush-Gahlawat/qr-generator" target="_blank" rel="noopener">Source on
                GitHub</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "YOUR_TOKEN"}'></script>
</body>

</html>
