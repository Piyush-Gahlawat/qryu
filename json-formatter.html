<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JSON Formatter — Format, Minify & Validate | Shiryu Kit</title>
    <meta name="description"
        content="Free online JSON formatter and validator. Beautify or minify JSON instantly, catch syntax errors with clear messages. Runs entirely in your browser — no data uploaded." />
    <meta name="keywords"
        content="json formatter, json validator, json beautifier, json minifier, format json online, pretty print json" />
    <link rel="canonical" href="https://shiryu-kit.shiryu.workers.dev/json-formatter.html" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="JSON Formatter & Validator" />
    <meta property="og:description"
        content="Beautify, minify, and validate JSON instantly. Free, no signup, runs in your browser." />
    <meta property="og:url" content="https://shiryu-kit.shiryu.workers.dev/json-formatter.html" />
    <meta property="og:site_name" content="Shiryu Kit" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="JSON Formatter & Validator" />
    <meta name="twitter:description" content="Beautify, minify, validate JSON. Free, no signup." />

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%234f46e5'/><text x='50' y='68' font-size='52' font-family='system-ui' font-weight='700' text-anchor='middle' fill='white'>S</text></svg>" />

    <link rel="stylesheet" href="/css/shared.css" />
    <link rel="stylesheet" href="/css/json-formatter.css" />
</head>

<body>
    <main class="container container-wide">
        <nav class="nav"><a href="/">← Shiryu Kit home</a></nav>

        <h1>JSON Formatter & Validator</h1>
        <p class="subtitle">Beautify, minify, and validate JSON. Everything runs in your browser — nothing is uploaded.
        </p>

        <div class="options">
            <label for="indent">Indent
                <select id="indent">
                    <option value="2" selected>2 spaces</option>
                    <option value="4">4 spaces</option>
                    <option value="tab">Tab</option>
                </select>
            </label>
            <button id="btn-format" class="btn-sm primary" type="button">Format</button>
            <button id="btn-minify" class="btn-sm" type="button">Minify</button>
            <button id="btn-sample" class="btn-sm" type="button">Load Sample</button>
            <button id="btn-clear" class="btn-sm" type="button">Clear</button>
        </div>

        <div class="panels">
            <div class="panel">
                <div class="panel-head">
                    <span>Input</span>
                    <span class="panel-meta" id="in-meta">0 B</span>
                </div>
                <textarea id="input" spellcheck="false"
                    placeholder='Paste JSON here, e.g. {"hello":"world"}'></textarea>
            </div>
            <div class="panel">
                <div class="panel-head">
                    <span>Output</span>
                    <div class="panel-actions">
                        <span class="panel-meta" id="out-meta">0 B</span>
                        <button id="btn-copy" class="btn-mini" type="button">Copy</button>
                        <button id="btn-download" class="btn-mini" type="button">Download</button>
                    </div>
                </div>
                <textarea id="output" spellcheck="false" readonly
                    placeholder="Formatted JSON will appear here"></textarea>
            </div>
        </div>

        <p id="status" class="status" aria-live="polite"></p>

        <p class="footer-note" style="margin-bottom: 10px;">
            Also try: <a href="/qr-generator.html">QR Code Generator</a> · <a href="/password-generator.html">Password
                Generator</a> ·
            <a href="/word-counter.html">Word Counter</a> · <a href="/resume-cleaner.html">ATS Resume Cleaner</a>
        </p>
        <p class="footer-note">
            Built by <strong>Shiryu</strong> · Free forever ·
            <a href="https://github.com/Piyush-Gahlawat/qr-generator" target="_blank" rel="noopener">Source on
                GitHub</a>
        </p>
    </main>

    <script type="module" src="/js/tools/json-formatter/controller.js"></script>
</body>

</html>
